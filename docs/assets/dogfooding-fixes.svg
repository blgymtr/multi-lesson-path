<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Seven problems found by dogfooding and their fixes">
<title>Seven problems found by dogfooding and their fixes</title>
<rect x="0" y="0" width="1200" height="560" rx="0" fill="#0f172a"/>
<rect x="12" y="12" width="1176" height="536" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
<text x="36" y="56" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#e2e8f0" font-weight="700">Found by using it</text>
<text x="36" y="82" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" font-weight="400">Seven problems found by running the tool on itself, all fixed</text>
<text x="92" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1.2">PROBLEM</text>
<text x="676" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1.2">FIX</text>
<rect x="36" y="130" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="154" r="12" fill="#334155"/>
<text x="66" y="159" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">1</text>
<text x="92" y="159" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Short keywords missed inflected forms</text>
<path d="M628 154 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="159" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Short keywords accept one common suffix</text>
<rect x="36" y="188" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="212" r="12" fill="#334155"/>
<text x="66" y="217" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">2</text>
<text x="92" y="217" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">An engine named in the prompt was ignored</text>
<path d="M628 212 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="217" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Engine mentions count and override detection</text>
<rect x="36" y="246" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="270" r="12" fill="#334155"/>
<text x="66" y="275" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">3</text>
<text x="92" y="275" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Failing-command hook matched unrelated lines</text>
<path d="M628 270 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="275" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Keywords match only on the failing lines</text>
<rect x="36" y="304" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="328" r="12" fill="#334155"/>
<text x="66" y="333" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">4</text>
<text x="92" y="333" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Sub-agent reports arrived as prompts</text>
<path d="M628 328 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="333" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Those blocks are stripped before matching</text>
<rect x="36" y="362" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="386" r="12" fill="#334155"/>
<text x="66" y="391" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">5</text>
<text x="92" y="391" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Error-string match dropped by engine filter</text>
<path d="M628 386 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="391" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Error strings bypass the engine filter</text>
<rect x="36" y="420" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="444" r="12" fill="#334155"/>
<text x="66" y="449" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">6</text>
<text x="92" y="449" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Benchmark failed on Windows short temp paths</text>
<path d="M628 444 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="449" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">Real long paths are used</text>
<rect x="36" y="478" width="1128" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
<circle cx="66" cy="502" r="12" fill="#334155"/>
<text x="66" y="507" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700" text-anchor="middle">7</text>
<text x="92" y="507" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8" font-weight="400">Distill sessions were saved, MCP servers loaded</text>
<path d="M628 502 h28 m-7 -6 l7 6 l-7 6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="507" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#2dd4bf" font-weight="600">--no-session-persistence, --strict-mcp-config</text>
</svg>
