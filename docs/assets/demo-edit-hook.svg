<rect x="12" y="12" width="976" height="361" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><path d="M12 50 H988" stroke="#334155"/><circle cx="34" cy="31" r="6" fill="#f87171"/><circle cx="54" cy="31" r="6" fill="#fbbf24"/><circle cx="74" cy="31" r="6" fill="#34d399"/><text x="500" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" xml:space="preserve">Claude Code · PreToolUse hook (edit)</text><text x="32" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">Claude: I will fix the arm pivot in the viewmodel script.</text><text x="32" y="103" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  Edit  scenes/player/viewmodel.gd</text><text x="32" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">  hook: edit → path matches **/*viewmodel*  (engine: godot)</text><text x="32" y="157" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#fbbf24" font-weight="700" xml:space="preserve">additionalContext injected before the edit runs</text><text x="32" y="178" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">[multi-lesson-path] Lessons from earlier work that match this file. Check them</text><text x="32" y="199" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">before acting; if one is wrong or outdated, say so and run `mlp feedback &lt;id&gt; wrong`.</text><text x="32" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">- fps-viewmodel-arm-rest-pose: First-person arms look twisted or detached because the rig's</text><text x="32" y="241" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">  rest pose and axes do not match the camera</text><text x="32" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  **Didn't work:** rotating the hand and forearm bones by eye in the editor until the hands</text><text x="32" y="283" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  looked right from one camera angle; mirroring the model with a negative scale to fix a</text><text x="32" y="304" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  flipped wrist; changing the field of view… **Root cause:** The arm rig was authored in its</text><text x="32" y="325" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  own modelling space, often with a different up or forward axis from the engine camera.</text><text x="32" y="346" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  Godot cameras look down local -Z. Unity cameras look down local +Z. An arm that was…</text>
</svg>
