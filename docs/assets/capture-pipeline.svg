<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="360" viewBox="0 0 1260 360" role="img" aria-label="Capture pipeline: archive, harvest, distill, human review, lessons">
<title>Capture pipeline: archive, harvest, distill, human review, lessons</title>
<rect width="1260" height="360" fill="#0f172a"/>
<text x="40" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e2e8f0" font-weight="700" xml:space="preserve">Capture pipeline</text><text x="40" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" xml:space="preserve">Turn past sessions into reviewed lessons. Nothing calls a model unless you run distill.</text><rect x="40" y="150" width="170" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="125" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="middle" xml:space="preserve">Transcripts</text><text x="125" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">Claude Code sessions</text><text x="125" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">deleted after 30 days</text><path d="M213 215 L243 215" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M243 215 L234.8959760788259 218.91468980700108 L234.8959760788259 211.08531019299892 Z" fill="#2dd4bf"/><rect x="246" y="150" width="170" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="331" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="middle" xml:space="preserve">mlp archive</text><text x="331" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">condensed .jsonl.gz</text><text x="331" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">SessionEnd hook</text><path d="M419 215 L449 215" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M449 215 L440.8959760788259 218.91468980700108 L440.8959760788259 211.08531019299892 Z" fill="#2dd4bf"/><rect x="452" y="150" width="170" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="537" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="middle" xml:space="preserve">mlp harvest</text><text x="537" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">failure → fix episodes</text><text x="537" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">candidate digests</text><path d="M625 215 L655 215" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M655 215 L646.8959760788259 218.91468980700108 L646.8959760788259 211.08531019299892 Z" fill="#2dd4bf"/><rect x="658" y="150" width="170" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="743" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="middle" xml:space="preserve">mlp distill</text><text x="743" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">your own claude -p</text><text x="743" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">drafts, no tools</text><path d="M831 215 L861 215" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M861 215 L852.8959760788259 218.91468980700108 L852.8959760788259 211.08531019299892 Z" fill="#2dd4bf"/><rect x="864" y="150" width="170" height="130" rx="10" fill="#0b3b3a" stroke="#2dd4bf" stroke-width="2.5"/><text x="949" y="190" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e2e8f0" font-weight="700" text-anchor="middle" xml:space="preserve">accept / reject</text><text x="949" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">you read the draft</text><text x="949" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">lint, then move in</text><path d="M1037 215 L1067 215" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M1067 215 L1058.895976078826 218.91468980700108 L1058.895976078826 211.08531019299892 Z" fill="#2dd4bf"/><rect x="1070" y="150" width="170" height="130" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/><text x="1155" y="190" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#2dd4bf" font-weight="700" text-anchor="middle" xml:space="preserve">Lessons</text><text x="1155" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" xml:space="preserve">lessons/*.md</text><text x="1155" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" xml:space="preserve">injected by hooks</text><rect x="897" y="106" width="104" height="26" rx="13" fill="#2dd4bf"/><text x="949" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" xml:space="preserve">human review</text><path d="M949 132 V150" stroke="#2dd4bf" stroke-width="2"/><text x="40" y="330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" xml:space="preserve">mlp reject marks a candidate so it is never harvested again.</text>
</svg>
