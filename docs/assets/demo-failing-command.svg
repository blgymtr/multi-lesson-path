<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="A failing python command triggers an injected lesson about the Microsoft Store alias">
<title>A failing python command triggers an injected lesson about the Microsoft Store alias</title>
<rect width="1000" height="350" fill="#0f172a"/>
<rect x="12" y="12" width="976" height="326" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><path d="M12 50 H988" stroke="#334155"/><circle cx="34" cy="31" r="6" fill="#f87171"/><circle cx="54" cy="31" r="6" fill="#fbbf24"/><circle cx="74" cy="31" r="6" fill="#34d399"/><text x="500" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" xml:space="preserve">Claude Code · PostToolUse hook (failed command)</text><text x="32" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" font-weight="700" xml:space="preserve">Claude runs:  python --version</text><text x="32" y="103" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#f87171" xml:space="preserve">Python was not found; run without arguments to install from the Microsoft Store.</text><text x="32" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#f87171" xml:space="preserve">exit code 9009</text><text x="32" y="145" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">  hook: post-tool → output looks failed; error string "python was not found" matches</text><text x="32" y="178" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#fbbf24" font-weight="700" xml:space="preserve">additionalContext injected after the failure</text><text x="32" y="199" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">[multi-lesson-path] Lessons from earlier work that match this error. Check them</text><text x="32" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">before acting; if one is wrong or outdated, say so and run `mlp feedback &lt;id&gt; wrong`.</text><text x="32" y="241" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">- windows-python-store-alias: "python" opens the Microsoft Store instead of running Python</text><text x="32" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  **Didn't work:** reinstalling Python from python.org with the default options, then</text><text x="32" y="283" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  running the same command again; restarting the terminal several times… **Root cause:**</text><text x="32" y="304" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  Windows 10 and 11 ship App Execution Alias stubs named `python.exe` and `python3.exe` in</text><text x="32" y="325" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">  `%LOCALAPPDATA%\Microsoft\WindowsApps`. That folder is usually early in PATH, so the…</text>
</svg>
