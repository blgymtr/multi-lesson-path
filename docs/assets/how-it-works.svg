<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Hook events go through the matcher; matching lessons are injected as context">
<title>Hook events go through the matcher; matching lessons are injected as context</title>
<rect width="1200" height="560" fill="#0f172a"/>
<text x="40" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#e2e8f0" font-weight="700" xml:space="preserve">How it works</text><text x="40" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" xml:space="preserve">Hooks run on fixed Claude Code events. No model call, no server.</text><rect x="40" y="92" width="280" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="58" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" xml:space="preserve">You type a prompt</text><text x="58" y="138" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#2dd4bf" xml:space="preserve">UserPromptSubmit</text><path d="M320 121 L376 230" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M376 230 L368.81460157300984 224.5805858761848 L375.77865762938626 221.00272221419328 Z" fill="#2dd4bf"/><rect x="40" y="164" width="280" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="58" y="188" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" xml:space="preserve">Claude edits a file</text><text x="58" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#2dd4bf" xml:space="preserve">PreToolUse</text><path d="M320 193 L376 230" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M376 230 L367.0805254050391 228.79876190959186 L371.3965278011216 222.26643395876434 Z" fill="#2dd4bf"/><rect x="40" y="236" width="280" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="58" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" xml:space="preserve">A command fails</text><text x="58" y="282" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#2dd4bf" xml:space="preserve">PostToolUse</text><path d="M320 265 L376 230" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M376 230 L371.2025829073795 237.6147744050256 L367.0530200110759 230.97547377093977 Z" fill="#2dd4bf"/><rect x="40" y="308" width="280" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="58" y="332" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" xml:space="preserve">A session starts</text><text x="58" y="354" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#2dd4bf" xml:space="preserve">SessionStart: "always" lessons</text><path d="M320 337 L376 230" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M376 230 L375.71057380944217 238.99534504508966 L368.77379395966767 235.36488082464695 Z" fill="#2dd4bf"/><rect x="376" y="120" width="300" height="220" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/><text x="526" y="152" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#2dd4bf" font-weight="700" text-anchor="middle" xml:space="preserve">Matcher</text><text x="526" y="174" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" text-anchor="middle" xml:space="preserve">mlp hook &lt;kind&gt;</text><circle cx="404" cy="204" r="3" fill="#2dd4bf"/><text x="416" y="209" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">keywords</text><circle cx="404" cy="230" r="3" fill="#2dd4bf"/><text x="416" y="235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">file globs</text><circle cx="404" cy="256" r="3" fill="#2dd4bf"/><text x="416" y="261" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">error strings</text><circle cx="404" cy="282" r="3" fill="#2dd4bf"/><text x="416" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">engine &amp; project filters</text><circle cx="404" cy="308" r="3" fill="#2dd4bf"/><text x="416" y="313" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">once per session</text><path d="M676 230 L744 230" stroke="#2dd4bf" stroke-width="2" fill="none"/><path d="M744 230 L735.8959760788259 233.91468980700108 L735.8959760788259 226.08531019299892 Z" fill="#2dd4bf"/><rect x="744" y="110" width="416" height="130" rx="10" fill="#0b3b3a" stroke="#2dd4bf" stroke-width="2"/><text x="764" y="142" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" xml:space="preserve">Match: lessons are injected</text><text x="764" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">≤ 3 lessons, ≤ 2000 chars injected</text><text x="764" y="194" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0" xml:space="preserve">as additionalContext</text><text x="764" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" xml:space="preserve">Each lesson shown at most once per session.</text><rect x="744" y="262" width="416" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="764" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" xml:space="preserve">Nothing matches: nothing injected</text><text x="764" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" xml:space="preserve">Silent, exit 0. Hooks never block an action.</text><path d="M526 420 L526 342" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M526 342 L529.9146898070011 350.1040239211741 L522.0853101929989 350.1040239211741 Z" fill="#94a3b8"/><rect x="40" y="420" width="1120" height="110" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="60" y="452" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" xml:space="preserve">Lessons store</text><text x="60" y="484" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#2dd4bf" xml:space="preserve">~/.claude/multi-lesson-path/lessons/*.md</text><text x="60" y="510" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" xml:space="preserve">your lessons, shared across all projects</text><path d="M610 440 V514" stroke="#334155" stroke-width="1.5"/><text x="640" y="484" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#2dd4bf" xml:space="preserve">&lt;project&gt;/.lessons/*.md</text><text x="640" y="510" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" xml:space="preserve">lessons that belong to one project</text>
</svg>
