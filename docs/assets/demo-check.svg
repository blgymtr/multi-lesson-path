<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="mlp check shows which lessons match, with scores and reasons">
<title>mlp check shows which lessons match, with scores and reasons</title>
<rect width="1000" height="350" fill="#0f172a"/>
<rect x="12" y="12" width="976" height="326" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/><path d="M12 50 H988" stroke="#334155"/><circle cx="34" cy="31" r="6" fill="#f87171"/><circle cx="54" cy="31" r="6" fill="#fbbf24"/><circle cx="74" cy="31" r="6" fill="#34d399"/><text x="500" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" xml:space="preserve">Terminal · mlp check (dry run, changes no state)</text><text x="32" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">$ cd ~/projects/my-game   # a Godot project</text><text x="32" y="103" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" font-weight="700" xml:space="preserve">$ mlp check --prompt "the FPS arms look twisted after import"</text><text x="32" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">fps-viewmodel-arm-rest-pose  score=63  First-person arms look twisted or detached because the</text><text x="32" y="145" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">rig's rest pose and axes do not match the camera</text><text x="32" y="166" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">    strong:fps arms, engine</text><text x="32" y="199" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">$ cd ~/projects/my-scripts   # a Python project</text><text x="32" y="220" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" font-weight="700" xml:space="preserve">$ mlp check --error "Python was not found; run without arguments to install from the Microsoft Store"</text><text x="32" y="241" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#2dd4bf" xml:space="preserve">windows-python-store-alias  score=83  "python" opens the Microsoft Store instead of running Python</text><text x="32" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">    error:python was not found, engine</text><text x="32" y="295" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e2e8f0" font-weight="700" xml:space="preserve">$ mlp check --prompt "unrelated question about cooking"</text><text x="32" y="316" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94a3b8" xml:space="preserve">No lessons match (6 active lessons checked).</text>
</svg>
